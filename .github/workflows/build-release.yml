name: 构建与发布

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        os: [windows-2022]
        include:
          - os: windows-2022
            target: win
            ext: '.exe'
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 安装 setuptools（修复 Python 3.12 缺 distutils 导致的 node-gyp 失败）
        run: python -m pip install setuptools

      - name: 安装依赖
        run: npm ci

      - name: 代码检查
        run: npm run typecheck

      - name: 构建
        run: npm run build

      - name: 打包 Windows 安装程序
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: RichCat-${{ github.ref_name }}-${{ matrix.os }}
          path: dist/*.exe

  create-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: 生成 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 财听猫 RichCat ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            *.exe
            *.exe.blockmap
            latest.yml
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}