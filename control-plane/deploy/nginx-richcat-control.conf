# 财听猫中央管理后台 —— nginx 反代配置（追加到 /etc/nginx/conf.d/）
# 部署：cp 到 /etc/nginx/conf.d/richcat-control.conf && nginx -s reload
# 域名后置：先用 IP 和 8443 端口，后期绑定 ops.richcat.ai 后替换 server_name 并配证书

# 注意：80 和 443 已被其他站点占用（vitacloud default_server），
# 本配置用 8443 替代 443（HTTPS 自签），避免端口冲突。

server {
    listen 8443 ssl http2;
    server_name 129.226.204.240;

    ssl_certificate     /etc/nginx/ssl/richcat.crt;
    ssl_certificate_key /etc/nginx/ssl/richcat.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 安全头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'" always;

    # 管理后台静态文件（React build 产物）
    root /opt/richcat-control/web;
    index index.html;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代到 Go 服务（docker compose 内网）
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE（错误流实时推送）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # 遥测端点（Agent 上行）—— 放行，但单独限速
    location = /api/v1/telemetry {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        limit_req zone=telemetry burst=40 nodelay;
    }

    # 登录接口限速（防爆破）
    location = /api/v1/auth/login {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        limit_req zone=login burst=5 nodelay;
    }

    # 静态资源长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# 80 端口已被其他站点占用，不重复监听 80。
# 限流 zone 定义需在 nginx.conf http{} 内添加：
#   limit_req_zone $binary_remote_addr zone=telemetry:10m rate=20r/s;
#   limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;
